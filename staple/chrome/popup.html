<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 320px;
      height: auto;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      flex-direction: column;
    }

    #st-header {
      padding: 12px 16px;
      border-bottom: 1px solid #222;
      font-weight: 600;
      font-size: 14px;
      flex-shrink: 0;
    }

    #settings-view {
      flex: 1;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      display: flex;
      overflow-y: auto;
    }
    .settings-label {
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .settings-input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 8px 12px;
      color: white;
      font-size: 12px;
      outline: none;
      font-family: monospace;
    }
    .settings-input:focus, .settings-select:focus { border-color: #6366f1; }
    .settings-select {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 8px 12px;
      color: white;
      font-size: 12px;
      outline: none;
      appearance: auto;
    }
    #save-btn {
      background: #6366f1;
      border: none;
      border-radius: 8px;
      padding: 10px;
      color: white;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      margin-top: 4px;
    }
    #save-btn:hover { background: #4f46e5; }
    #save-status {
      font-size: 12px;
      color: #6ee7b7;
      text-align: center;
      min-height: 18px;
    }
    .settings-section { display: flex; flex-direction: column; gap: 4px; }
    .settings-divider {
      border: none;
      border-top: 1px solid #222;
      margin: 4px 0;
    }
    .settings-hidden { display: none; }
  </style>
</head>
<body>
  <div id="st-header">Staple</div>

  <div id="settings-view">
    <hr class="settings-divider" />

    <div class="settings-section">
      <div class="settings-label">Provider</div>
      <select class="settings-select" id="select-provider">
        <option value="deepseek">DeepSeek</option>
        <option value="openai">OpenAI</option>
        <option value="anthropic">Anthropic</option>
        <option value="groq">Groq</option>
        <option value="gemini">Google Gemini</option>
        <option value="ollama">Ollama (local)</option>
      </select>
    </div>

    <div class="settings-section" id="section-model-select">
      <div class="settings-label">Model</div>
      <select class="settings-select" id="select-model"></select>
    </div>

    <div class="settings-section settings-hidden" id="section-model-custom">
      <div class="settings-label">Model</div>
      <input class="settings-input" id="input-model-custom" placeholder="llama3.1" />
    </div>

    <div class="settings-section" id="section-api-key">
      <div class="settings-label">API Key</div>
      <input class="settings-input" id="input-api-key" type="password" placeholder="sk-..." />
    </div>

    <button id="save-btn">Save</button>
    <div id="save-status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
